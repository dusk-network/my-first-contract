[package]
name = "my-first-contract-dd"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Data driver for my-first-contract (JSON <-> RKYV)"
repository = "https://github.com/dusk-network/my-first-contract"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dusk-core = { git = "https://github.com/dusk-network/rusk", branch = "master", features = ["serde"] }
dusk-data-driver = { git = "https://github.com/dusk-network/rusk", branch = "master" }

[features]
ffi = ["dusk-data-driver/wasm-export"]
js = ["ffi", "dusk-data-driver/alloc"]
